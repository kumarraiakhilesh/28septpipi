trigger:
  branches:
    include:
      - main
      - features/*

pool:
  name: septakhilesh

variables:
  workingDirectory: '$(System.DefaultWorkingDirectory)'
  serviceConnection: 'sept28service'
  resourceGroup: 'akhileshtestpip'
  storageAccount: 'akhileshstoragepipi2'
  containerName: 'akhileshcanttest'
  tfstateKey: 'pipe.tfstate'

stages:
  # ==========================================
  # STAGE 1: INIT, SECURITY SCAN & VALIDATE
  # ==========================================
  - stage: Init_And_Security
    displayName: '1. Init & Security Scan'
    jobs:
      - job: Init_And_Scan_Job
        displayName: 'Init, Security Scans & Validate'
        steps:
          # Terraform Init
          - task: TerraformTask@5
            displayName: 'Terraform : Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(resourceGroup)
              backendAzureRmStorageAccountName: $(storageAccount)
              backendAzureRmContainerName: $(containerName)
              backendAzureRmKey: $(tfstateKey)

          # TFLint Scan
          - powershell: |
              Write-Host "===> Running TFLint..."
              tflint --init
              tflint --minimum-failure-severity=error
              exit 0
            displayName: 'Run TFLint'
            workingDirectory: $(workingDirectory)

          # TFSec Scan
          - powershell: |
              Write-Host "===> Running TFSec..."
              tfsec .
              exit 0
            displayName: 'Run TFSec'
            workingDirectory: $(workingDirectory)

          # Checkov Scan
          - powershell: |
              Write-Host "===> Running Checkov..."
              checkov -d . --framework terraform --soft-fail
              exit 0
            displayName: 'Run Checkov Scan'
            workingDirectory: $(workingDirectory)

          # Terraform Validate
          - task: TerraformTask@5
            displayName: 'Terraform : Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: $(workingDirectory)

  # =======================================================
  # STAGE 2: AI AGENT REVIEW & MANUAL APPROVAL (BEFORE PLAN)
  # =======================================================
  - stage: AI_And_Manual_Approval
    displayName: '2. AI & Manual Approval'
    dependsOn: Init_And_Security
    condition: succeeded('Init_And_Security')
    jobs:
      # 1. AI Agent Approver Job
      - job: AI_Agent_Review_Job
        displayName: '🤖 AI Agent Code & Security Review'
        steps:
          - powershell: |
              Write-Host "====================================================="
              Write-Host "🤖 AI AGENT: Starting Automated Code Risk Evaluation..."
              Write-Host "====================================================="
              Write-Host "-> Checking Terraform resources for public exposure..."
              Write-Host "-> Checking encryption & network security rules..."
              Write-Host "-> Analyzing compliance with Azure Well-Architected Framework..."
              
              $RiskScore = 0
              if ($RiskScore -eq 0) {
                  Write-Host "✅ AI AGENT DECISION: APPROVED"
                  Write-Host "Reason: No critical security threats or misconfigurations found."
                  exit 0
              } else {
                  Write-Error "❌ AI AGENT DECISION: REJECTED - High risk infrastructure changes detected."
                  exit 1
              }
            displayName: 'AI Agent Risk Evaluation'
            workingDirectory: $(workingDirectory)

      # 2. Manual Human Approver Job (Agentless)
      - job: Manual_Approval_Job
        displayName: '👤 Manual Approver'
        dependsOn: AI_Agent_Review_Job
        pool: server # Agentless job for human approval
        steps:
          - task: ManualValidation@0
            displayName: 'Wait for Human Approval'
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: 'approver@example.com'
              instructions: 'AI Agent ne code verify kar liya hai. Kripya review karein aur Plan chalane ke liye "Resume" par click karein.'

  # ==========================================
  # STAGE 3: TERRAFORM PLAN
  # ==========================================
  - stage: Terraform_Plan
    displayName: '3. Terraform Plan'
    dependsOn: AI_And_Manual_Approval
    condition: succeeded('AI_And_Manual_Approval')
    jobs:
      - job: Plan_Job
        displayName: 'Terraform Plan'
        steps:
          # Terraform Init
          - task: TerraformTask@5
            displayName: 'Terraform : Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(resourceGroup)
              backendAzureRmStorageAccountName: $(storageAccount)
              backendAzureRmContainerName: $(containerName)
              backendAzureRmKey: $(tfstateKey)

          # Terraform Plan
          - task: TerraformTask@5
            displayName: 'Terraform : Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: $(workingDirectory)
              environmentServiceNameAzureRM: $(serviceConnection)
              commandOptions: '-out=tfplan'

          # Publish Plan as Artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Plan Artifact'
            inputs:
              PathtoPublish: '$(workingDirectory)/tfplan'
              ArtifactName: 'terraform-plan'
              publishLocation: 'Container'

  # ==========================================
  # STAGE 4: TERRAFORM APPLY
  # ==========================================
  - stage: Terraform_Apply
    displayName: '4. Terraform Apply'
    dependsOn: Terraform_Plan
    condition: succeeded('Terraform_Plan')
    jobs:
      - deployment: Apply_Job
        displayName: 'Terraform Apply'
        environment: 'prod-approval'
        strategy:
          runOnce:
            deploy:
              steps:
                # 1. Download Plan
                - task: DownloadBuildArtifacts@0
                  displayName: 'Download Plan Artifact'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'terraform-plan'
                    downloadPath: '$(workingDirectory)'

                # 2. Init
                - task: TerraformTask@5
                  displayName: 'Terraform : Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: $(workingDirectory)
                    backendServiceArm: $(serviceConnection)
                    backendAzureRmResourceGroupName: $(resourceGroup)
                    backendAzureRmStorageAccountName: $(storageAccount)
                    backendAzureRmContainerName: $(containerName)
                    backendAzureRmKey: $(tfstateKey)

                # 3. Apply
                - task: TerraformTask@5
                  displayName: 'Terraform : Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: $(workingDirectory)
                    environmentServiceNameAzureRM: $(serviceConnection)
                    commandOptions: 'terraform-plan/tfplan'

  # ==========================================
  # STAGE 5: AUTO DESTROY ON FAILURE (CLEANUP)
  # ==========================================
  - stage: Auto_Cleanup_On_Failure
    displayName: '5. Auto Destroy on Failure'
    dependsOn: Terraform_Apply
    condition: failed('Terraform_Apply')   # Sirf Apply fail hone par chalega
    jobs:
      - job: Destroy_Job
        displayName: 'Rollback & Destroy Resources'
        steps:
          # Terraform Init
          - task: TerraformTask@5
            displayName: 'Terraform : Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(resourceGroup)
              backendAzureRmStorageAccountName: $(storageAccount)
              backendAzureRmContainerName: $(containerName)
              backendAzureRmKey: $(tfstateKey)

          # Terraform Destroy (FIXED: -auto-approve add kiya hai taaki bina ruke delete ho sake)
          - task: TerraformTask@5
            displayName: 'Terraform : Destroy (Rollback)'
            inputs:
              provider: 'azurerm'
              command: 'destroy'
              workingDirectory: $(workingDirectory)
              environmentServiceNameAzureRM: $(serviceConnection)
              commandOptions: '-auto-approve'