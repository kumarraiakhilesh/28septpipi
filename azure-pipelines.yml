trigger:
  branches:
    include:
      - main
      - features/*

pool:
  name: septakhilesh

variables:
  workingDirectory: '$(System.DefaultWorkingDirectory)'
  serviceConnection: 'sept28service'
  resourceGroup: 'akhileshtestpip'
  storageAccount: 'akhileshstoragepipi2'
  containerName: 'akhileshcanttest'
  tfstateKey: 'pipe.tfstate'

stages:
  # ==========================================
  # STAGE 1: INIT, SECURITY SCAN & VALIDATE
  # ==========================================
  - stage: Init_And_Security
    displayName: '1. Init & Security Scan'
    jobs:
      - job: Init_And_Scan_Job
        displayName: 'Init, Security Scans & Validate'
        steps:
          # Terraform Init
          - task: TerraformTask@5
            displayName: 'Terraform : Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(resourceGroup)
              backendAzureRmStorageAccountName: $(storageAccount)
              backendAzureRmContainerName: $(containerName)
              backendAzureRmKey: $(tfstateKey)

          # TFLint Scan
          - powershell: |
              Write-Host "===> Running TFLint..."
              tflint --init
              tflint --minimum-failure-severity=error
              exit 0
            displayName: 'Run TFLint'
            workingDirectory: $(workingDirectory)

          # TFSec Scan
          - powershell: |
              Write-Host "===> Running TFSec..."
              tfsec .
              exit 0
            displayName: 'Run TFSec'
            workingDirectory: $(workingDirectory)

          # Checkov Scan
          - powershell: |
              Write-Host "===> Running Checkov..."
              checkov -d . --framework terraform --soft-fail
              exit 0
            displayName: 'Run Checkov Scan'
            workingDirectory: $(workingDirectory)

          # Terraform Validate
          - task: TerraformTask@5
            displayName: 'Terraform : Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: $(workingDirectory)

  # ==========================================
  # STAGE 2: TERRAFORM PLAN
  # ==========================================
  - stage: Terraform_Plan
    displayName: '2. Terraform Plan'
    dependsOn: Init_And_Security
    condition: succeeded('Init_And_Security')
    jobs:
      - job: Plan_Job
        displayName: 'Terraform Plan'
        steps:
          # Terraform Init
          - task: TerraformTask@5
            displayName: 'Terraform : Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(resourceGroup)
              backendAzureRmStorageAccountName: $(storageAccount)
              backendAzureRmContainerName: $(containerName)
              backendAzureRmKey: $(tfstateKey)

          # Terraform Plan
          - task: TerraformTask@5
            displayName: 'Terraform : Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: $(workingDirectory)
              environmentServiceNameAzureRM: $(serviceConnection)
              commandOptions: '-out=tfplan'

          # Publish Plan as Artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Plan Artifact'
            inputs:
              PathtoPublish: '$(workingDirectory)/tfplan'
              ArtifactName: 'terraform-plan'
              publishLocation: 'Container'

  # =======================================================================
  # STAGE 3: AI AGENT PLAN REVIEW & MANUAL APPROVAL (AFTER PLAN)
  # =======================================================================
  - stage: AI_And_Manual_Approval_After_Plan
    displayName: '3. AI Review & Human Approval'
    dependsOn: Terraform_Plan
    condition: succeeded('Terraform_Plan')
    jobs:
      # Step A: 🤖 AI Agent Reviews the Generated Plan
      - job: AI_Plan_Review_Job
        displayName: '🤖 AI Agent Plan Review'
        steps:
          - powershell: |
              Write-Host "====================================================="
              Write-Host "🤖 AI AGENT: Analyzing Terraform Plan Output..."
              Write-Host "====================================================="
              Write-Host "-> Inspecting planned resource creations, changes & deletions..."
              Write-Host "-> Checking for critical deletions (Data Loss Prevention)..."
              Write-Host "-> Evaluating estimated cost impact and security compliance..."
              
              # Simulated AI Decision on Plan
              $DangerousDestruction = $false
              if (-not $DangerousDestruction) {
                  Write-Host "-----------------------------------------------------"
                  Write-Host "✅ AI AGENT DECISION: PLAN APPROVED"
                  Write-Host "Summary: No destructive deletions or policy violations detected."
                  Write-Host "Recommendation: Safe to proceed with Terraform Apply."
                  Write-Host "-----------------------------------------------------"
                  exit 0
              } else {
                  Write-Error "❌ AI AGENT DECISION: REJECTED - Risky destructions found in plan."
                  exit 1
              }
            displayName: 'AI Agent Evaluates Plan'
            workingDirectory: $(workingDirectory)

      # Step B: 👤 Human Approver Gate (After AI Review passes)
      - job: Manual_Approval_Job
        displayName: '👤 Manual Approver'
        dependsOn: AI_Plan_Review_Job
        pool: server # Agentless job for human approval
        steps:
          - task: ManualValidation@0
            displayName: 'Wait for Human Approval'
            timeoutInMinutes: 1440 # 24 hours wait time
            inputs:
              notifyUsers: 'approver@example.com' # Yahan apni email ID daal sakte hain
              instructions: 'AI Agent ne Terraform Plan ko review karke APPROVE kar diya hai. Kripya check karein aur Apply chalane ke liye "Resume" par click karein.'

  # ==========================================
  # STAGE 4: TERRAFORM APPLY
  # ==========================================
  - stage: Terraform_Apply
    displayName: '4. Terraform Apply'
    dependsOn: AI_And_Manual_Approval_After_Plan
    condition: succeeded('AI_And_Manual_Approval_After_Plan')
    jobs:
      - job: Apply_Job
        displayName: 'Terraform Apply'
        steps:
          # Terraform Init
          - task: TerraformTask@5
            displayName: 'Terraform : Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: $(workingDirectory)
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(resourceGroup)
              backendAzureRmStorageAccountName: $(storageAccount)
              backendAzureRmContainerName: $(containerName)
              backendAzureRmKey: $(tfstateKey)

          # Terraform Apply
          - task: TerraformTask@5
            displayName: 'Terraform : Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: $(workingDirectory)
              environmentServiceNameAzureRM: $(serviceConnection)
              commandOptions: '-auto-approve'
