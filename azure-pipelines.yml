# ========================================================
# TRIGGER (main और सभी features/* ब्रांचेस के लिए)
# ========================================================
trigger:
  branches:
    include:
      - main
      - features/*

# ========================================================
# POOL (आपका Self-Hosted / Private Agent Pool)
# ========================================================
pool:
  name: 'septakhilesh'

# ========================================================
# 1. PARAMETERS (UI में Run टाइम पर ऑन/ऑफ और सेलेक्ट करने के लिए)
# ========================================================
parameters:
  - name: Environment
    displayName: "Select Target Environment"
    type: string
    default: "dev"
    values:
      - "dev"
      - "qa"
      - "prod"

  - name: RunSonarQube
    displayName: "Run SonarQube Scan?"
    type: boolean
    default: true

  - name: RunCheckmarx
    displayName: "Run Checkmarx Scan?"
    type: boolean
    default: false

  - name: RunBlackduck
    displayName: "Run Blackduck Scan?"
    type: boolean
    default: false

  - name: RunTrivy
    displayName: "Run Trivy Container Scan?"
    type: boolean
    default: true

# ========================================================
# 2. VARIABLES (सभी टूल्स और सेटिंग्स के वेरिएबल्स)
# ========================================================
variables:
  # Environment Variable (Parameter से वैल्यू लेगा)
  selectedEnv: '${{ parameters.Environment }}'

  # Docker & Azure Container Registry (ACR) Variables
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  imageRepository: 'my-microservice'
  tag: '$(Build.BuildId)'
  containerRegistry: 'myacrregistry.azurecr.io'
  dockerRegistryServiceConnection: 'My-ACR-ServiceConnection'

  # SonarQube Variables
  sonarServiceConnection: 'My-SonarQube-Connection'
  sonarHostUrl: 'https://sonarcloud.io'
  sonarProjectKey: 'my-microservice-$(selectedEnv)'
  sonarProjectName: 'My-Microservice-$(selectedEnv)'

  # Checkmarx Variables
  checkmarxServiceConnection: 'My-Checkmarx-Connection'
  checkmarxPreset: 'Checkmarx Default'

  # Blackduck Variables
  blackduckServiceConnection: 'My-Blackduck-Connection'
  blackduckProjectName: 'my-microservice'

  # Trivy Scan Variables
  trivySeverity: 'HIGH,CRITICAL'
  trivyExitCode: '0'     # क्रिटिकल बग पर पाइपलाइन रोकनी हो तो '1' करें
  trivyFormat: 'table'   # 'table' या 'json'

# ========================================================
# 3. STAGES
# ========================================================
stages:

  # ------------------------------------------------------
  # Stage 1: SonarQube Stage (SAST Code Quality)
  # ------------------------------------------------------
  - stage: SonarQubeStage
    displayName: 'SonarQube Stage'
    condition: ${{ eq(parameters.RunSonarQube, true) }}
    jobs:
      - job: SonarQubeJob
        displayName: 'SonarQube Job'
        steps:
          - checkout: self
            displayName: 'Clone Code'

          - script: |
              echo "==> Running SonarQube Scan on pool: septakhilesh"
              echo "Project Key: $(sonarProjectKey)"
              echo "Project Name: $(sonarProjectName)"
              echo "Host URL: $(sonarHostUrl)"
              echo "Environment: $(selectedEnv)"
            displayName: 'SonarQube Task'
            env:
              SONAR_HOST_URL: $(sonarHostUrl)
              SONAR_PROJECT_KEY: $(sonarProjectKey)

  # ------------------------------------------------------
  # Stage 2: Checkmarx Scan (SAST Security)
  # ------------------------------------------------------
  - stage: CheckmarxScan
    displayName: 'Checkmarx Scan'
    condition: ${{ eq(parameters.RunCheckmarx, true) }}
    jobs:
      - job: CheckmarxJob
        displayName: 'Checkmarx Scan Job'
        steps:
          - checkout: self
            displayName: 'Clone Code'

          - script: |
              echo "==> Running Checkmarx SAST Scan"
              echo "Service Connection: $(checkmarxServiceConnection)"
              echo "Preset: $(checkmarxPreset)"
              echo "Target Source: $(Build.SourcesDirectory)"
            displayName: 'Checkmarx Scan Task'

  # ------------------------------------------------------
  # Stage 3: Blackduck Scan (SCA / Open Source Scan)
  # ------------------------------------------------------
  - stage: BlackduckScan
    displayName: 'Blackduck Scan'
    condition: ${{ eq(parameters.RunBlackduck, true) }}
    jobs:
      - job: BlackduckJob
        displayName: 'Blackduck Scan Job'
        steps:
          - checkout: self
            displayName: 'Clone Code'

          - script: |
              echo "==> Running Blackduck Dependency Scan"
              echo "Project: $(blackduckProjectName)"
              echo "Service Connection: $(blackduckServiceConnection)"
            displayName: 'Blackduck Scan Task'

  # ------------------------------------------------------
  # Stage 4: Build and Push Stage (Docker Build)
  # ------------------------------------------------------
  - stage: BuildAndPushStage
    displayName: 'Build and Push Stage'
    dependsOn: []
    jobs:
      - job: BuildAndPushJob
        displayName: 'Build and Push job'
        steps:
          - checkout: self
            displayName: 'Clone Code'

          - script: |
              echo "==> Building Docker Image on pool: septakhilesh"
              echo "Image Full Path: $(containerRegistry)/$(imageRepository):$(tag)"
              echo "Dockerfile Path: $(dockerfilePath)"
              docker build -f $(dockerfilePath) -t $(containerRegistry)/$(imageRepository):$(tag) .
            displayName: 'Build and Push task'

  # ------------------------------------------------------
  # Stage 5: Trivy Scan (Container Vulnerability Scan)
  # ------------------------------------------------------
  - stage: TrivyScan
    displayName: 'Trivy Scan'
    dependsOn: BuildAndPushStage
    condition: and(succeeded(), ${{ eq(parameters.RunTrivy, true) }})
    jobs:
      - job: TrivyScanJob
        displayName: 'Trivy Scan job'
        steps:
          - script: |
              echo "==> Pulling Image for Scanning"
              echo "Target Image: $(containerRegistry)/$(imageRepository):$(tag)"
            displayName: 'Pull Image'

          - script: |
              echo "==> Running Trivy Container Scan"
              echo "Severity Filter: $(trivySeverity)"
              echo "Output Format: $(trivyFormat)"
              trivy image --severity $(trivySeverity) --format $(trivyFormat) --exit-code $(trivyExitCode) $(containerRegistry)/$(imageRepository):$(tag)
            displayName: 'Trivy Scan task'